proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - 中国
      - 节能
      - 莱垠
      - DIRECT
      - 莱垠-WARP-01
      - 莱垠-WARP-02
      - 莱垠-WARP-03
      - 莱垠-WARP-04
      - 莱垠-WARP-05
      - 莱垠-WARP-06
      - 莱垠-WARP-07
      - 莱垠-WARP-08
      - 莱垠-WARP-09
      - 莱垠-WARP-10
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 中国
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 节能
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 莱垠
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - 莱垠-WARP-01
      - 莱垠-WARP-02
      - 莱垠-WARP-03
      - 莱垠-WARP-04
      - 莱垠-WARP-05
      - 莱垠-WARP-06
      - 莱垠-WARP-07
      - 莱垠-WARP-08
      - 莱垠-WARP-09
      - 莱垠-WARP-10
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
      - 故障转移
      - 负载均衡
  - name: 节点代理
    type: select
    proxies:
      - 节点选择
      - DIRECT
      - 自动选择
      - 故障转移
      - 负载均衡
rules:
  - GEOIP,CN,全球直连
  - MATCH,节点代理
