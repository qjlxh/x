proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - 负载均衡
      - 中国
      - 节能
      - 莱垠
      - DIRECT
      - Warp•01
      - Warp•02
      - Warp•03
      - Warp•04
      - Warp•05
      - Warp•06
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 中国
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 节能
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - DIRECT
  - name: 莱垠
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50
    proxies:
      - Warp•01
      - Warp•02
      - Warp•03
      - Warp•04
      - Warp•05
      - Warp•06
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - 节点选择
      - 自动选择
      - 故障转移
      - 负载均衡
  - name: 节点代理
    type: select
    proxies:
      - 节点选择
      - DIRECT
      - 自动选择
      - 故障转移
      - 负载均衡
rules:
  - GEOIP,CN,全球直连
  - MATCH,节点代理
